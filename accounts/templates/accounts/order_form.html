{%extends 'accounts/main.html' %}
{% load static %}
{% block content %}

<div class="row">
    <div class="col-md-6">
        <div class="card card-body">
            <form style="margin: 4px;" method="POST">
                {% csrf_token %}
                {{formset.management_form}}
                {% for form in formset %}
                {{form}}
                <hr>
                {% endfor %}
                <input class="btn btn-sm btn-info" style="margin: 4px;" type="submit" name="submit">
            </form>
        </div>
    </div>
</div>

{% endblock %}
